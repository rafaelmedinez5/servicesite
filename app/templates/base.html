<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if private_page %}<meta name="robots" content="noindex, nofollow, noarchive">{% endif %}
    <title>{% block title %}Servicesite{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('public.index') }}">Servicesite</a>
      <span class="network-label">XMR checkout</span>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>Payments do not authorize testing. Engagement scope and written authorization are reviewed separately.</p>
    </footer>
  </body>
</html>
